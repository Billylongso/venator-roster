name: Sync battalion roster

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours (UTC)
  workflow_dispatch: # "Run workflow" button for manual syncs

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Build roster.json from VRChat groups
        run: python sync_roster.py
        env:
          VRC_USERNAME: ${{ secrets.VRC_USERNAME }}
          VRC_PASSWORD: ${{ secrets.VRC_PASSWORD }}
          VRC_TOTP_SECRET: ${{ secrets.VRC_TOTP_SECRET }}
          VRC_CONTACT: ${{ secrets.VRC_CONTACT }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
